name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses `npm ci` when a committed package-lock.json exists (reproducible),
      # otherwise falls back to `npm install`. Commit the lockfile to speed CI
      # up and make installs deterministic.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Lint is advisory: it reports issues but never blocks the build/test gates.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        # No secrets needed: API keys are read at request time and default to
        # empty, and the API routes are force-dynamic (not prerendered).
        run: npm run build
